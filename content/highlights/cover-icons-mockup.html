<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trivpass — Highlight cover icons mockup</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<style>
  :root{
    --canvas:#faf7f2;       /* warm off-white */
    --ink:#1f4d3a;          /* jungle green */
    --accent:#c2603e;       /* terracotta */
    --surface:#ede8de;      /* warm surface */
    --muted:#6a706c;        /* label gray */
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:#1a1d1b;
    font-family:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    padding:48px 24px;display:flex;flex-direction:column;align-items:center;gap:8px}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:600;color:var(--ink);font-size:22px;margin:0}
  p.note{color:var(--muted);font-size:13px;margin:0 0 28px;max-width:560px;text-align:center;line-height:1.5}
  .row{display:flex;justify-content:center;flex-wrap:wrap;gap:18px;
    background:var(--surface);border-radius:16px;padding:32px 24px;max-width:760px;width:100%}
  .hl{display:flex;flex-direction:column;align-items:center;gap:10px;width:84px}
  .circle{width:70px;height:70px;border-radius:50%;background:var(--canvas);
    border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center}
  .circle i{font-size:28px;color:var(--ink)}
  .hl span{font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
  <h1>trivpass<span style="color:var(--accent)">.</span> — highlight covers</h1>
  <p class="note">One style: off-white circle, single jungle-green outline icon, centered. Monochrome — no terracotta, no photo, no text in the cover. Labels are rendered by Instagram, so keep them short.</p>
  <div class="row">
    <div class="hl"><div class="circle"><i class="ti ti-compass" aria-hidden="true"></i></div><span>Start here</span></div>
    <div class="hl"><div class="circle"><i class="ti ti-car" aria-hidden="true"></i></div><span>Drivers</span></div>
    <div class="hl"><div class="circle"><i class="ti ti-receipt" aria-hidden="true"></i></div><span>Prices</span></div>
    <div class="hl"><div class="circle"><i class="ti ti-headset" aria-hidden="true"></i></div><span>Support</span></div>
    <div class="hl"><div class="circle"><i class="ti ti-route" aria-hidden="true"></i></div><span>Trips</span></div>
    <div class="hl"><div class="circle"><i class="ti ti-ticket" aria-hidden="true"></i></div><span>Activities</span></div>
    <div class="hl"><div class="circle"><i class="ti ti-bulb" aria-hidden="true"></i></div><span>Bali tips</span></div>
  </div>
</body>
</html>
